name: publish-python

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade build "python[dev]"
      - name: Run Python quality gates
        run: |
          python -m ruff check python/src python/tests python/scripts python/benchmarks
          python -m pytest python/tests
      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(python -c "from pathlib import Path; import re; source = Path('python/pyproject.toml').read_text(); match = re.search(r'^version = \"([^\"]+)\"$', source, re.MULTILINE); assert match, 'version is missing from python/pyproject.toml'; print(match.group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build distributions
        run: node scripts/build-python.mjs
      - name: Verify clean wheel installation
        run: python python/scripts/verify_clean_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/causentra/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
