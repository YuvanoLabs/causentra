name: Feature request
description: Propose a user outcome or public-product improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and ROADMAP.md.
          required: true
        - label: I can describe a user problem, not only a preferred implementation.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters the problem, during which task, and what is the measurable impact?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance evidence
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, compatibility, or operational considerations
      description: Identify data capture, schema, performance, migration, or package-boundary effects.
