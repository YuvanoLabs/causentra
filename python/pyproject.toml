[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "causentra"
version = "0.1.0a1"
description = "Privacy-first, framework-neutral runtime telemetry for Python AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Causentra contributors" }]
keywords = [
  "ai-agents",
  "agent-observability",
  "multi-agent",
  "tracing",
  "opentelemetry",
  "otlp",
  "langgraph",
  "openai-agents",
  "crewai",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/smartbytecoder/causentra"
Documentation = "https://github.com/smartbytecoder/causentra/tree/main/docs"
Repository = "https://github.com/smartbytecoder/causentra"
Issues = "https://github.com/smartbytecoder/causentra/issues"

[project.scripts]
causentra = "causentra.cli:main"
causentra-collector = "causentra.collector:main"
causentra-key-hash = "causentra.collector:hash_key_main"

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.18,<0.19"]
langgraph = ["langchain-core>=1.4,<1.5", "langgraph>=1.2,<1.3"]
crewai = ["crewai>=1.15.3,<1.16"]
google-adk = ["google-adk>=2.4,<2.5"]
semantic-kernel = ["semantic-kernel>=1.44,<1.45"]
autogen = [
  "autogen-agentchat>=0.7.5,<0.8",
  "autogen-core>=0.7.5,<0.8",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
frameworks = [
  "openai-agents>=0.18,<0.19",
  "langchain-core>=1.4,<1.5",
  "langgraph>=1.2,<1.3",
  "crewai>=1.15.3,<1.16",
  "google-adk>=2.4,<2.5",
  "semantic-kernel>=1.44,<1.45",
  "autogen-agentchat>=0.7.5,<0.8",
  "autogen-core>=0.7.5,<0.8",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
kafka = ["confluent-kafka>=2.12,<3"]
nats = ["nats-py>=2.10,<3"]
redis = ["redis>=6,<9"]
mqtt = ["paho-mqtt>=2.1,<3"]
websocket = ["websockets>=14,<16"]
transports = [
  "confluent-kafka>=2.12,<3",
  "nats-py>=2.10,<3",
  "redis>=6,<9",
  "paho-mqtt>=2.1,<3",
  "websockets>=14,<16",
]
dev = ["build>=1.2,<2", "pytest>=9.0.3,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]
security = ["bandit>=1.9,<2", "pip-audit>=2.10,<3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
causentra = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "live_transport: requires operator-supplied live broker or receiver endpoints",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["causentra"]
mypy_path = "src"
follow_imports = "skip"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
